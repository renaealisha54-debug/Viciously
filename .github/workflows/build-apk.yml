name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libsqlite3-dev ffmpeg libffi-dev libssl-dev libxml2-dev libxslt1-dev zlib1g-dev default-jdk unzip

    - name: Install Buildozer & Cython
      run: |
        pip install --upgrade pip
        pip install "buildozer>=1.5.0" "cython<3.0.0" kivy

    - name: Pre-Accept Android SDK Licenses
      run: |
        SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
        LICENSES_DIR="$SDK_DIR/licenses"
        mkdir -p "$LICENSES_DIR"
        
        # Inject standard Google SDK license hashes
        echo -e "\n24333f8a6378b741d05da42707206b83e0e4af1b" > "$LICENSES_DIR/android-sdk-license"
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" >> "$LICENSES_DIR/android-sdk-license"
        echo -e "\nd975f75130aa09605989573623a6844113456935" > "$LICENSES_DIR/android-sdk-preview-license"
        echo -e "\n33b622e74721051520e53995f36e4f1642c13149" > "$LICENSES_DIR/android-googletv-license"
        echo -e "\n601007157806018d9735510f2249e29087541ef4" > "$LICENSES_DIR/mips-android-sysimage-license"

    - name: Build APK with Buildozer
      run: |
        cd ${{ github.workspace }}
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: viciously-mediator-apk
        path: bin/*.apk
